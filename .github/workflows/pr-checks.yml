name: PR Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check (compileall)
        run: python -m compileall -q . || true
      - name: Tests if present
        run: |
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt || true; fi
          if command -v pytest >/dev/null 2>&1; then pytest -q; else echo "no pytest"; fi
