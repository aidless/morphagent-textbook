name: SAST
on:
  push:
    branches:
    - main
    - master
  pull_request: null
permissions:
  contents: read
jobs:
  gitleaks:
    permissions:
      security-events: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: gitleaks (secret scan, full history)
      run: "set -euo pipefail\ncurl -sSfL --retry 3 -o /tmp/gitleaks.tgz \\\n  https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz\n\
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks\n/tmp/gitleaks detect --source\
        \ . --redact --no-banner --verbose\n"
