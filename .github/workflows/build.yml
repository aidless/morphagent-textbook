name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml markdown

      - name: Validate chapter frontmatter
        run: python scripts/validate_chapters.py

      - name: Build Book.txt
        run: python scripts/build_book.py

      - name: Count words and pages
        run: python scripts/word_count.py >> $GITHUB_STEP_SUMMARY

  test-experiments:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run experiments (mock mode)
        # `|| true` made this loop structurally unfailable: a crash, a bad import
        # or a syntax error in any of the 31 teaching experiments still ended the
        # step green. These are the mock-mode runs readers copy, so a broken one
        # ships silently. Accumulate the failure and report it after the loop, so
        # every experiment still runs and the step still has teeth.
        run: |
          set -uo pipefail
          cd experiments
          rc=0
          failed=0
          for dir in exp-*/; do
            if [ -f "$dir/main.py" ]; then
              echo "Testing $dir..."
              if ! python "$dir/main.py" --mock; then
                echo "::error::$dir/main.py failed in mock mode"
                failed=$((failed + 1))
                rc=1
              fi
            fi
          done
          echo "experiments failed: $failed"
          exit "$rc"

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [validate, test-experiments]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build HTML site
        run: pip install markdown pyyaml && python _build_html.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site/

      - id: deployment
        uses: actions/deploy-pages@v4

  secret-scan:
    # Full history: a key leaked in an old commit is still a live key. The CLI is
    # used rather than gitleaks-action, which needs GITHUB_TOKEN to scan pull
    # requests and so turns every Dependabot PR red for an unrelated reason --
    # and a PR runs the workflow from its own branch, so a fix on main does not
    # take effect until the branch is regenerated. Pinned, not latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
