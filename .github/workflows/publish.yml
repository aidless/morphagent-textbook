name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build-publish:
    if: hashFiles('pyproject.toml') != '' || hashFiles('setup.py') != '' || hashFiles('setup.cfg') != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          python -m build --sdist --wheel --outdir dist/
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@2442bad8f54b06a326f3030ef5e6a7a674118557 # release/v1
